name: One-shot source migration

on:
  push:
    paths:
      - '.github/workflows/migrate-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact bridge sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jaredwilder/unpublished-math-papers.git /tmp/papers
          git clone --depth 1 https://github.com/jaredwilder/erdos-proved-lemmas.git /tmp/lemmas
          git clone --depth 1 https://github.com/jaredwilder/erdos-theorems.git /tmp/theorems
          mkdir -p bridge compact divisor-window
          cp -R /tmp/papers/erdos890-1093-bridge/. bridge/
          cp /tmp/lemmas/erdos890-1093-bridge.md compact/
          cp -R /tmp/theorems/erdos1093-divisor-window/. divisor-window/
          rm .github/workflows/migrate-source.yml
          git config user.name "Jared Wilder release migration"
          git config user.email "jared@jaredwilder.com"
          git add -A
          git commit -m "Migrate exact Erdős 890/1093 bridge sources"
          git push
